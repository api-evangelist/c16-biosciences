name: C16 Biosciences
description: C16 Biosciences is a New York City based synthetic biology company producing high-performance,
  sustainable ingredients for consumer goods manufacturers through its proprietary Palmless platform. Using
  microbial fermentation and biotechnology, C16 designs plant-free, deforestation-free alternatives to palm oil
  and petroleum-derived commodity ingredients for beauty and personal care, food, and home and personal care
  markets. Its flagship Palmless Torula Oil is a bioactive super-emollient with antioxidant properties for
  skincare formulations, alongside designer fats, oils, fatty acids, triglycerides, and alcohols. The company
  was added to the API Evangelist network as a portfolio company of DCVC; it is an ingredients and biomanufacturing
  business and does not currently publish a public developer platform or API.
